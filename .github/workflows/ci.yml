name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}

    - name: Build extension
      run: |
        phpize
        ./configure --enable-nbt
        make -j$(nproc)
        sudo make install

    - name: Run PHPT tests
      run: |
        make test TESTS="-q --show-diff tests/"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/stable' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Prepare release archives
      run: |
        git archive --format=tar.gz -o ext-nbt.tar.gz HEAD
        git archive --format=zip -o ext-nbt.zip HEAD

    - name: Publish GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Publishing tagged release for ${TAG_NAME}..."
          gh release delete "${TAG_NAME}" --yes || true
          gh release create "${TAG_NAME}" ext-nbt.tar.gz ext-nbt.zip \
            --title "Release ${TAG_NAME}" \
            --generate-notes
        else
          echo "Publishing rolling release for latest..."
          git tag -f latest
          git push -f origin latest
          gh release delete latest --yes || true
          gh release create latest ext-nbt.tar.gz ext-nbt.zip \
            --title "Release latest" \
            --notes "Automated release from commit ${{ github.sha }} on $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
        fi
